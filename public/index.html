<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MVP Barber Club</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header>
    <h1>MVP Barber Club</h1>
    <p>Servicios, clientes y citas</p>
  </header>

  <main>
    <!-- Servicios (vienen de Cal.com) -->
    <section>
      <h2>Servicios</h2>
      <p class="fuente"><span id="fuente-servicios">Fuente: GET /servicios</span> · <a href="/servicios" target="_blank">Ver JSON</a></p>
      <div id="servicios" class="lista">Cargando servicios...</div>
    </section>

    <!-- Clientes (datos de prueba de JSONPlaceholder) -->
    <section>
      <h2>Clientes</h2>
      <p class="fuente"><span id="fuente-clientes">Fuente: GET /clientes</span> · <a href="/clientes" target="_blank">Ver JSON</a></p>
      <div id="clientes" class="lista">Cargando clientes...</div>
    </section>

    <!-- Citas (vienen de Cal.com) -->
    <section>
      <h2>Citas</h2>
      <p class="fuente"><span id="fuente-citas">Fuente: GET /citas</span> · <a href="/citas" target="_blank">Ver JSON</a></p>
      <div id="citas" class="lista">Cargando citas...</div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
